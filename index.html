<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 Booster Opening</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="stage">
    <div id="tray" class="tray"></div>

    <button id="booster" class="booster" type="button" aria-label="Open booster">
      <svg class="booster-face" viewBox="0 0 419 629" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="boosterClip">
            <rect width="419" height="629" rx="14" ry="14"></rect>
          </clipPath>

          <!-- main erosion mask: fractal noise thresholded by an animated
               cutoff, sweeping from fully-opaque to fully-transparent —
               the organic "burning paper" dissolve -->
          <filter id="burnAlphaMain" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.009" numOctaves="4" seed="7" result="noise"></feTurbulence>
            <feColorMatrix in="noise" type="luminanceToAlpha" result="gray"></feColorMatrix>
            <feComponentTransfer in="gray" result="thresholdAlpha">
              <feFuncA type="linear" slope="30" intercept="18">
                <animate id="burnAnimMain" attributeName="intercept" begin="indefinite"
                  from="18" to="-34" dur="1.9s" fill="freeze"
                  calcMode="spline" keySplines="0.3 0 0.2 1"></animate>
              </feFuncA>
            </feComponentTransfer>
            <!-- luminanceToAlpha leaves color at black; a mask's effective
                 value is alpha*luminance, so black-with-alpha=1 reads as
                 "hide", not "show". Re-flood white and stencil it through
                 the threshold alpha so the mask is actually white where it
                 should reveal. -->
            <feFlood flood-color="#ffffff" result="white"></feFlood>
            <feComposite in="white" in2="thresholdAlpha" operator="in"></feComposite>
          </filter>
          <mask id="burnMaskMain" maskUnits="userSpaceOnUse" x="0" y="0" width="419" height="629">
            <rect width="419" height="629" fill="#fff" filter="url(#burnAlphaMain)"></rect>
          </mask>

          <!-- ring mask: same noise field thresholded twice at a small
               fixed offset — the band between the two cutoffs is exactly
               the strip of paper about to catch, i.e. the glowing edge -->
          <filter id="burnAlphaRing" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.009" numOctaves="4" seed="7" result="noise"></feTurbulence>
            <feColorMatrix in="noise" type="luminanceToAlpha" result="gray"></feColorMatrix>
            <feComponentTransfer in="gray" result="alphaA">
              <feFuncA type="linear" slope="30" intercept="18">
                <animate id="burnAnimRingA" attributeName="intercept" begin="indefinite"
                  from="18" to="-34" dur="1.9s" fill="freeze"
                  calcMode="spline" keySplines="0.3 0 0.2 1"></animate>
              </feFuncA>
            </feComponentTransfer>
            <feComponentTransfer in="gray" result="alphaB">
              <feFuncA type="linear" slope="30" intercept="15.5">
                <animate id="burnAnimRingB" attributeName="intercept" begin="indefinite"
                  from="15.5" to="-36.5" dur="1.9s" fill="freeze"
                  calcMode="spline" keySplines="0.3 0 0.2 1"></animate>
              </feFuncA>
            </feComponentTransfer>
            <feComposite in="alphaA" in2="alphaB" operator="out" result="ring"></feComposite>
            <feMorphology in="ring" operator="dilate" radius="1.2" result="ringDilate"></feMorphology>
            <feGaussianBlur in="ringDilate" stdDeviation="4" result="ringBlur"></feGaussianBlur>
            <feFlood flood-color="#ffffff" result="white2"></feFlood>
            <feComposite in="white2" in2="ringBlur" operator="in"></feComposite>
          </filter>
          <mask id="burnMaskRing" maskUnits="userSpaceOnUse" x="0" y="0" width="419" height="629">
            <rect width="419" height="629" fill="#fff" filter="url(#burnAlphaRing)"></rect>
          </mask>

          <radialGradient id="emberGradient" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#fff0a3"></stop>
            <stop offset="30%" stop-color="#ffa000"></stop>
            <stop offset="62%" stop-color="#ff3d00"></stop>
            <stop offset="100%" stop-color="#8f0000"></stop>
          </radialGradient>
        </defs>

        <g clip-path="url(#boosterClip)">
          <image href="./assets/booster-pack.png" width="419" height="629"
            preserveAspectRatio="none" mask="url(#burnMaskMain)"></image>
          <rect width="419" height="629" fill="url(#emberGradient)"
            mask="url(#burnMaskRing)" style="mix-blend-mode:screen"></rect>
        </g>
      </svg>
    </button>
  </div>

  <script src="./app.js"></script>
</body>
</html>
